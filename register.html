<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <link rel="icon" href="/images/icon.svg" type="image/x-icon">
     <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bad+Script&family=Caveat:wght@400..700&family=Philosopher:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  </head>
</head>
<body>
     <div class="restar">
        <div class="registration">
            <h1>Регистрация</h1>
            <form action="#" method="post" class="form">
    <div class="form__reg">
        <label class="form__reg-text" for="fio">ФИО</label>
        <input type="text" id="fio" name="fio" class="form__reg-input" placeholder="Ваше ФИО" required>
    </div>
    <div class="form__reg">
        <label class="form__reg-text" for="email">Почта</label>
        <input type="email" id="email" name="email" class="form__reg-input" placeholder="Ваша почта" required>
    </div>
    <div class="form__reg">
        <label class="form__reg-text" for="password">Пароль</label>
        <input type="password" id="password" name="password" class="form__reg-input" placeholder="Ваш пароль" required minlength="8">
    </div>
    <div class="form__reg form__reg-two">
        <div class="form__regis">
            <label class="form__reg-text" for="phone">Номер телефона</label>
            <input type="tel" id="phone" name="phone" class="form__reg-input" placeholder="Ваш телефон">
        </div>
        <div class="form__regis">
            <label class="form__reg-text" for="birth">Дата рождения</label>
            <input type="date" id="birth" name="birth" class="form__reg-input">
        </div>
    </div>
    <button type="submit" id="btn__restar" class="btn__restar">Зарегистрироваться</button>
</form>
        </div>
        
     </div>
</body>
</html>
