     <div class="restar">
        <div class="registration input">
            <h1>Вход</h1>
            <form action="#" method="post" class="form form_input"  id="form__input">
    <div class="form__reg">
        <label class="form__reg-text" for="email">Почта</label>

    </div>
    <div class="form__reg">
        <label class="form__reg-text" for="password">Пароль</label>
        <input type="password" id="password" name="password" class="form__reg-input" placeholder="Ваш пароль">
    </div>
    <button type="submit" id="btn__restar" class="btn__restar">Войти</button>
   
</form>
 <p class="input__p">Если у вас нет аккаунта, то стоит <a href="register.html">зарегистрироваться</a></p>
